<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Permainan — IKS EduGames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#ffcc4d;
    --gold-dim:#a8863a;
    --text:#f4f0e6;
    --text-dim:#aeb6cf;
    --accent:#9b6fd1;
    --accent-dim:#5a3f8a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background:#080b14;
    color:var(--text);
    font-family:'Inter',sans-serif;
    position:relative;
    -webkit-user-select:none;user-select:none;
  }

  /* ---- animated background layer, crossfades per game ---- */
  .bg-layer{
    position:fixed;inset:-5%;
    z-index:0;
    filter:blur(60px) saturate(1.3) brightness(.55);
    transform:scale(1.15);
    transition:opacity 1.1s ease;
  }
  .bg-img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:0;transition:opacity 1.1s ease;
  }
  .bg-img.active{opacity:1;}
  .bg-tint{
    position:fixed;inset:0;z-index:1;
    background:radial-gradient(ellipse 70% 55% at 50% 40%, transparent 0%, #080b14 78%);
    pointer-events:none;
  }
  .bg-vignette{
    position:fixed;inset:0;z-index:1;
    background:linear-gradient(180deg, rgba(8,11,20,.55) 0%, transparent 22%, transparent 70%, rgba(8,11,20,.85) 100%);
    pointer-events:none;
  }

  /* ---- bokeh orbs (soft floating depth blobs, parallax) ---- */
  .bokeh-layer{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
  .bokeh{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle, var(--accent) 0%, transparent 70%);
    opacity:.22;filter:blur(2px);
    transition:background 1.2s ease;
    animation:floatBokeh ease-in-out infinite;
  }
  @keyframes floatBokeh{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(var(--dx,20px), var(--dy,-30px)) scale(1.08);}
  }

  /* ---- shimmer light sweep ---- */
  .shimmer{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(115deg, transparent 40%, rgba(255,255,255,.06) 48%, rgba(255,255,255,.10) 50%, rgba(255,255,255,.06) 52%, transparent 60%);
    background-size:250% 250%;
    animation:sweep 9s ease-in-out infinite;
    mix-blend-mode:screen;
  }
  @keyframes sweep{
    0%{background-position:120% 0%;}
    50%{background-position:0% 100%;}
    100%{background-position:120% 0%;}
  }

  /* ---- fine sparkle motes (small, twinkling, colored per game) ---- */
  .motes{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;}
  .mote{
    position:absolute;bottom:-10px;border-radius:50%;
    background:var(--accent);
    opacity:0;filter:blur(.4px);
    box-shadow:0 0 6px 1px var(--accent);
    animation:rise linear infinite;
    transition:background 1.2s ease, box-shadow 1.2s ease;
  }
  @keyframes rise{
    0%{transform:translateY(0) translateX(0) scale(.6);opacity:0;}
    8%{opacity:.9;}
    50%{transform:translateY(-55vh) translateX(var(--driftX,15px)) scale(1);}
    92%{opacity:.5;}
    100%{transform:translateY(-112vh) translateX(calc(var(--driftX,15px) * 2)) scale(.5);opacity:0;}
  }

  .stage{
    position:relative;z-index:2;
    height:100dvh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:24px;
    touch-action:pan-y;
  }

  .eyebrow{
    position:absolute;top:26px;left:0;right:0;
    text-align:center;
    font-size:11px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--gold);font-weight:600;opacity:.8;
  }
  .eyebrow::before,.eyebrow::after{content:"✦";margin:0 9px;opacity:.6;}

  .slide-wrap{
    position:relative;
    width:min(340px, 70vw);
    max-width:360px;
  }

  .card{
    transition:opacity .5s ease, transform .5s ease;
  }
  .card.fading{opacity:0;transform:scale(.94);}

  .arch{
    position:relative;
    border-radius:210px 210px 16px 16px;
    overflow:hidden;
    aspect-ratio:4/3.7;
    box-shadow:
      0 30px 70px -20px rgba(0,0,0,.75),
      inset 0 0 0 3px rgba(255,255,255,.09),
      inset 0 0 60px 8px rgba(0,0,0,.5);
  }
  .arch::before{
    content:"";position:absolute;inset:0;border-radius:inherit;padding:3px;
    background:linear-gradient(160deg, var(--accent), transparent 40%, var(--accent-dim) 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    animation:pulseRim 3.4s ease-in-out infinite;
    z-index:3;pointer-events:none;
  }
  @keyframes pulseRim{0%,100%{opacity:.55;}50%{opacity:1;}}
  .arch img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;}
  .arch .lock-icon{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:42px;opacity:.45;
    background:repeating-linear-gradient(135deg,#10182c 0 14px,#0d1424 14px 28px);
  }
  .arch-glow{position:absolute;left:0;right:0;bottom:0;height:50%;
    background:linear-gradient(180deg,transparent,rgba(0,0,0,.6) 75%);z-index:2;pointer-events:none;}

  .tag-row{display:flex;gap:8px;justify-content:center;margin:16px 0 8px;flex-wrap:wrap;}
  .tag{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    padding:5px 11px;border-radius:100px;background:rgba(255,255,255,.07);
    color:var(--accent);border:1px solid rgba(255,255,255,.09);}

  .p-title{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(24px,5vw,32px);
    text-align:center;margin:2px 0 6px;color:#fff;}
  .p-tagline{text-align:center;font-size:13.5px;color:var(--text-dim);line-height:1.55;
    max-width:320px;margin:0 auto 20px;min-height:40px;}

  .p-cta{
    display:flex;align-items:center;justify-content:center;gap:9px;
    margin:0 auto;width:fit-content;
    padding:14px 30px;border-radius:14px;
    background:linear-gradient(180deg,var(--accent),var(--accent-dim));
    color:#1a1305;font-weight:700;font-size:15px;
    box-shadow:0 6px 0 rgba(0,0,0,.28), 0 12px 24px -8px var(--accent);
    cursor:pointer;border:none;
    transition:filter .2s, transform .12s;
  }
  .p-cta:hover{filter:brightness(1.08);}
  .p-cta:active{transform:translateY(2px);box-shadow:0 4px 0 rgba(0,0,0,.28);}
  .p-cta.disabled{
    background:rgba(255,255,255,.06);color:var(--text-dim);box-shadow:none;cursor:default;
  }

  /* nav arrows */
  .nav-btn{
    position:absolute;top:50%;translate:0 -50%;
    width:52px;height:52px;border-radius:50%;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    color:var(--text);font-size:20px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;z-index:4;
    transition:background .2s, transform .2s;
    backdrop-filter:blur(6px);
  }
  .nav-btn:hover{background:rgba(255,255,255,.14);transform:translateY(-50%) scale(1.06);}
  .nav-btn.prev{left:4%;}
  .nav-btn.next{right:4%;}
  @media (max-width:560px){
    .nav-btn{width:42px;height:42px;font-size:16px;}
    .nav-btn.prev{left:2%;}
    .nav-btn.next{right:2%;}
  }

  .dots{
    position:absolute;bottom:28px;left:0;right:0;
    display:flex;gap:9px;justify-content:center;z-index:4;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:rgba(255,255,255,.22);
    cursor:pointer;transition:background .3s, transform .3s, width .3s;
  }
  .dot.active{background:var(--gold);width:22px;border-radius:5px;}

  @media (prefers-reduced-motion: reduce){
    .mote,.bokeh,.shimmer{animation:none !important;}
  }

  .swipe-hint{
    position:absolute;bottom:56px;left:0;right:0;text-align:center;
    font-size:11px;color:var(--text-dim);opacity:.65;
    letter-spacing:.03em;
    animation:hintFade 2.6s ease-in-out 1;
  }
  @keyframes hintFade{0%{opacity:0;}20%{opacity:.65;}80%{opacity:.65;}100%{opacity:0;}}
</style>
</head>
<body>

<div class="bg-layer" id="bgLayer"></div>
<div class="bokeh-layer" id="bokehLayer"></div>
<div class="bg-tint"></div>
<div class="bg-vignette"></div>
<div class="shimmer"></div>
<div class="motes" id="motes"></div>

<div class="stage" id="stage">
  <div class="eyebrow">IKS EduGames</div>

  <button class="nav-btn prev" id="prevBtn" aria-label="Game sebelumnya">‹</button>
  <button class="nav-btn next" id="nextBtn" aria-label="Game seterusnya">›</button>

  <div class="slide-wrap">
    <div class="card" id="card">
      <div class="arch" id="archBox">
        <img id="cardImg" src="" alt="">
        <div class="arch-glow"></div>
      </div>
      <div class="tag-row" id="tagRow"></div>
      <div class="p-title" id="titleEl"></div>
      <p class="p-tagline" id="taglineEl"></p>
      <button class="p-cta" id="ctaBtn"><span id="ctaLabel">Masuk Portal</span><span id="ctaArrow">▶</span></button>
    </div>
  </div>

  <div class="swipe-hint">← swipe atau guna anak panah untuk tukar game →</div>
  <div class="dots" id="dots"></div>
</div>

let current = 0;
let animating = false;

const root = document.documentElement;
const bgLayer = document.getElementById('bgLayer');
const bokehLayer = document.getElementById('bokehLayer');
const motesContainer = document.getElementById('motes');
const card = document.getElementById('card');
const archBox = document.getElementById('archBox');
const cardImg = document.getElementById('cardImg');
const tagRow = document.getElementById('tagRow');
const titleEl = document.getElementById('titleEl');
const taglineEl = document.getElementById('taglineEl');
const ctaBtn = document.getElementById('ctaBtn');
const ctaLabel = document.getElementById('ctaLabel');
const ctaArrow = document.getElementById('ctaArrow');
const dotsWrap = document.getElementById('dots');

// build bg image layers (one <img> per game, crossfaded via opacity)
const bgImgs = GAMES.map(g=>{
  const im = document.createElement('img');
  im.className = 'bg-img';
  if(g.img) im.src = g.img;
  bgLayer.appendChild(im);
  return im;
});

// fine rising sparkle motes
const MOTE_COUNT = 34;
for(let i=0;i<MOTE_COUNT;i++){
  const m = document.createElement('div');
  m.className = 'mote';
  const size = 2 + Math.random()*3.5;
  m.style.width = size+'px';
  m.style.height = size+'px';
  m.style.left = Math.random()*100+'%';
  m.style.setProperty('--driftX', (Math.random()*60-30)+'px');
  m.style.animationDuration = (6+Math.random()*9)+'s';
  m.style.animationDelay = (Math.random()*10)+'s';
  motesContainer.appendChild(m);
}

// big soft bokeh orbs, slow parallax drift
const BOKEH_COUNT = 7;
for(let i=0;i<BOKEH_COUNT;i++){
  const b = document.createElement('div');
  b.className = 'bokeh';
  const size = 90 + Math.random()*160;
  b.style.width = size+'px';
  b.style.height = size+'px';
  b.style.left = Math.random()*100+'%';
  b.style.top = Math.random()*100+'%';
  b.style.setProperty('--dx', (Math.random()*80-40)+'px');
  b.style.setProperty('--dy', (Math.random()*80-40)+'px');
  b.style.animationDuration = (10+Math.random()*10)+'s';
  b.style.animationDelay = (Math.random()*6)+'s';
  bokehLayer.appendChild(b);
}

// build dots
GAMES.forEach((g,i)=>{
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.addEventListener('click', ()=> goTo(i));
  dotsWrap.appendChild(d);
});
const dotEls = Array.from(dotsWrap.children);

function render(i){
  const g = GAMES[i];
  root.style.setProperty('--accent', g.accent);
  root.style.setProperty('--accent-dim', g.accentDim);

  if(g.locked){
    archBox.innerHTML = '<span class="lock-icon">🔒</span><div class="arch-glow"></div>';
  } else {
    archBox.innerHTML = '<img id="cardImg" src="'+g.img+'" alt="'+g.title+'"><div class="arch-glow"></div>';
  }

  tagRow.innerHTML = g.tags.map(t=>'<span class="tag">'+t+'</span>').join('');
  titleEl.textContent = g.title;
  taglineEl.textContent = g.tagline;

  if(g.locked){
    ctaBtn.classList.add('disabled');
    ctaLabel.textContent = 'Akan Datang';
    ctaArrow.textContent = '…';
  } else {
    ctaBtn.classList.remove('disabled');
    ctaLabel.textContent = 'Masuk Portal';
    ctaArrow.textContent = '▶';
  }

  bgImgs.forEach((im,idx)=> im.classList.toggle('active', idx===i));
  dotEls.forEach((d,idx)=> d.classList.toggle('active', idx===i));
}

function goTo(i){
  if(animating || i===current) return;
  animating = true;
  current = (i + GAMES.length) % GAMES.length;
  card.classList.add('fading');
  setTimeout(()=>{
    render(current);
    card.classList.remove('fading');
    setTimeout(()=>{ animating = false; }, 500);
  }, 260);
}

document.getElementById('prevBtn').addEventListener('click', ()=> goTo(current-1));
document.getElementById('nextBtn').addEventListener('click', ()=> goTo(current+1));
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowLeft') goTo(current-1);
  if(e.key==='ArrowRight') goTo(current+1);
});

// swipe support
let touchStartX = null;
const stage = document.getElementById('stage');
stage.addEventListener('touchstart', (e)=>{ touchStartX = e.touches[0].clientX; }, {passive:true});
stage.addEventListener('touchend', (e)=>{
  if(touchStartX===null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 45){
    if(dx < 0) goTo(current+1); else goTo(current-1);
  }
  touchStartX = null;
}, {passive:true});

// mouse-drag swipe (desktop)
let mouseStartX = null;
stage.addEventListener('mousedown', (e)=>{ mouseStartX = e.clientX; });
window.addEventListener('mouseup', (e)=>{
  if(mouseStartX===null) return;
  const dx = e.clientX - mouseStartX;
  if(Math.abs(dx) > 60){ if(dx<0) goTo(current+1); else goTo(current-1); }
  mouseStartX = null;
});

ctaBtn.addEventListener('click', ()=>{
  const g = GAMES[current];
  if(g.locked || !g.url) return;
  window.location.href = g.url;
});

render(0);
</script>

</body>
</html>
